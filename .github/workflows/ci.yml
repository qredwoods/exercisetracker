name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".github/workflows/ci.yml"

permissions:
  id-token: write
  contents: read

jobs:
  # ── Detect what changed ────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: backend/**
            frontend: frontend/**

  # ── Backend unit & integration tests ───────────────────────
  test:
    name: Backend tests
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm test
        working-directory: backend

  # ── Frontend lint ──────────────────────────────────────────
  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

  # ── E2E tests (Playwright) ────────────────────────────────
  # Always runs — tests the contract between frontend and backend.
  # Waits for fast checks to pass first to avoid wasting runner time.
  e2e:
    name: E2E tests
    needs: [test, lint]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04-arm
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # Install all three packages in parallel
      - run: |
          npm ci --prefix backend &
          npm ci --prefix frontend &
          npm ci --prefix e2e &
          wait

      # Cache Playwright browser binary across runs
      - id: playwright-version
        run: echo "version=$(npx --prefix e2e playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: e2e
      - run: npx playwright install-deps chromium

      # Start backend and frontend in the background
      - run: node controller.mjs &
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/exercisetracker-test
          ACCESS_TOKEN_SECRET: test-access-secret
          REFRESH_TOKEN_SECRET: test-refresh-secret
          CORS_ORIGIN: http://localhost:5173

      - run: npx vite --port 5173 &
        working-directory: frontend

      # Wait for both servers to be ready
      - run: |
          npx wait-on http://localhost:3000/health http://localhost:5173 --timeout 30000

      - run: npm test
        working-directory: e2e

  # ── Deploy backend ─────────────────────────────────────────
  deploy-backend:
    name: Deploy backend
    needs: [e2e, changes]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - run: |
          docker build \
            -t ${{ steps.ecr-login.outputs.registry }}/exercisetracker-api:${{ github.sha }} \
            -t ${{ steps.ecr-login.outputs.registry }}/exercisetracker-api:latest \
            backend/
      - run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/exercisetracker-api --all-tags

      - run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name exercisetracker-asg \
            --preferences '{"MinHealthyPercentage":100}'

      # Wait for the refresh to complete (checks every 15s, up to 10 min).
      - run: |
          echo "Waiting for instance refresh to complete..."
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name exercisetracker-asg \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "  Attempt $i: $STATUS"
            if [ "$STATUS" = "Successful" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then exit 1; fi
            sleep 15
          done
          echo "Timed out waiting for instance refresh"
          exit 1

      # Smoke test — verify the new instance is serving traffic.
      - run: |
          sleep 10
          curl -f --retry 3 --retry-delay 5 https://api.sparkmvmt.com/health

  # ── Deploy frontend ────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend
    needs: [e2e, changes]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.sparkmvmt.com

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
