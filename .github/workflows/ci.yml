name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "What to deploy"
        required: true
        type: choice
        options:
          - backend
          - frontend
          - both

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  # ── Detect what changed ────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: backend/**
            frontend: frontend/**
            e2e: e2e/**
            ci: .github/workflows/ci.yml

  # ── Backend unit & integration tests ───────────────────────
  test:
    name: Backend tests
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm test
        working-directory: backend

  # ── Frontend lint ──────────────────────────────────────────
  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

  # ── E2E tests (Playwright) ────────────────────────────────
  # Tests the contract between frontend and backend.
  # Skips when neither backend nor frontend changed (e.g. docs-only PRs).
  e2e:
    name: E2E tests
    needs: [changes, test, lint]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04-arm
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # Install all three packages in parallel
      - run: |
          npm ci --prefix backend &
          npm ci --prefix frontend &
          npm ci --prefix e2e &
          wait

      # Cache Playwright browser binary across runs
      - id: playwright-version
        run: echo "version=$(npx --prefix e2e playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: e2e

      # Start backend and frontend in the background
      - run: node controller.mjs &
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/exercisetracker-test
          ACCESS_TOKEN_SECRET: test-access-secret
          REFRESH_TOKEN_SECRET: test-refresh-secret
          CORS_ORIGIN: http://localhost:5173

      - run: npx vite --port 5173 &
        working-directory: frontend

      # Wait for both servers to be ready
      - run: |
          npx wait-on http://localhost:3000/health http://localhost:5173 --timeout 30000

      - run: npm test
        working-directory: e2e

  # ── Prepare backend (runs in parallel with E2E) ────────────
  # Builds image, pushes to ECR, and kicks off instance refresh early
  # so the instance boots while E2E runs (~2 min head start).
  prepare-backend:
    name: Prepare backend
    needs: [changes]
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' && needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' && (inputs.deploy == 'backend' || inputs.deploy == 'both')) }}
    runs-on: ubuntu-24.04-arm
    environment: production
    outputs:
      prev-digest: ${{ steps.prev-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: prev-image
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name exercisetracker-api \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "none")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Previous latest digest: $DIGEST"

      - run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t ${{ steps.ecr-login.outputs.registry }}/exercisetracker-api:${{ github.sha }} \
            -t ${{ steps.ecr-login.outputs.registry }}/exercisetracker-api:latest \
            --push \
            backend/

      - run: |
          LT=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names exercisetracker-asg \
            --query 'AutoScalingGroups[0].LaunchTemplate.LaunchTemplateId' --output text)
          VER=$(aws ec2 describe-launch-template-versions \
            --launch-template-id "$LT" --versions '$Latest' \
            --query 'LaunchTemplateVersions[0].VersionNumber' --output text)
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name exercisetracker-asg \
            --desired-configuration '{"LaunchTemplate":{"LaunchTemplateId":"'"$LT"'","Version":"'"$VER"'"}}' \
            --preferences '{"MinHealthyPercentage":100,"AutoRollback":true}'

  # ── Deploy backend ─────────────────────────────────────────
  # Waits for both E2E and prepare to finish. If E2E failed, cancels
  # the in-progress refresh. Otherwise polls and smoke tests.
  deploy-backend:
    name: Deploy backend
    needs: [e2e, prepare-backend]
    if: always() && needs.prepare-backend.result == 'success'
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # If E2E failed, cancel the in-progress refresh and abort
      - if: needs.e2e.result == 'failure' || needs.e2e.result == 'cancelled'
        run: |
          echo "E2E failed — cancelling instance refresh"
          aws autoscaling cancel-instance-refresh \
            --auto-scaling-group-name exercisetracker-asg || true
          exit 1

      # Instance already has a ~2 min head start from prepare-backend.
      # Sleep 2 min instead of 4, then poll.
      - run: |
          echo "Waiting 2 minutes (instance already booting)..."
          sleep 120
          echo "Polling for instance refresh status..."
          for i in $(seq 1 28); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name exercisetracker-asg \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "  Attempt $i: $STATUS"
            if [ "$STATUS" = "Successful" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then exit 1; fi
            sleep 15
          done
          echo "Timed out waiting for instance refresh"
          exit 1

      # Smoke test — verify health, demo creation (DB + auth), and authenticated read.
      - run: |
          sleep 10
          echo "=== Health check ==="
          curl -f --retry 3 --retry-delay 5 https://api.sparkmvmt.com/health

          echo ""
          echo "=== Demo account creation ==="
          DEMO=$(curl -sf --retry 2 --retry-delay 5 -X POST https://api.sparkmvmt.com/api/auth/demo)
          TOKEN=$(echo "$DEMO" | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to create demo account"
            exit 1
          fi
          echo "Demo account created successfully"

          echo ""
          echo "=== Authenticated exercise fetch ==="
          COUNT=$(curl -sf --retry 2 --retry-delay 5 -H "Authorization: Bearer $TOKEN" https://api.sparkmvmt.com/api/exercises | jq 'length')
          if [ "$COUNT" -lt 1 ]; then
            echo "Expected seeded exercises, got $COUNT"
            exit 1
          fi
          echo "Fetched $COUNT exercises — smoke test passed"

      # Rollback — re-tag previous image as latest and refresh ASG
      - if: failure() && needs.prepare-backend.outputs.prev-digest != 'none'
        run: |
          PREV=${{ needs.prepare-backend.outputs.prev-digest }}
          echo "Rolling back to previous image: $PREV"

          MANIFEST=$(aws ecr batch-get-image \
            --repository-name exercisetracker-api \
            --image-ids imageDigest="$PREV" \
            --query 'images[0].imageManifest' --output text)

          aws ecr put-image \
            --repository-name exercisetracker-api \
            --image-tag latest \
            --image-manifest "$MANIFEST"

          aws autoscaling cancel-instance-refresh \
            --auto-scaling-group-name exercisetracker-asg || true
          sleep 15

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name exercisetracker-asg \
            --preferences '{"MinHealthyPercentage":100}'

          echo "Rollback instance refresh started"

  # ── Deploy frontend ────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend
    needs: [e2e, changes, deploy-backend]
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' && needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' && (inputs.deploy == 'frontend' || inputs.deploy == 'both')) }}
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.sparkmvmt.com

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
